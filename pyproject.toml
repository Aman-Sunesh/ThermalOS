[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermalos"
version = "0.1.0"
description = "Urban heat intervention digital twin and budget optimizer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ThermalOS Team"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "shapely>=2.0,<3",
  "streamlit>=1.40,<2",
  "pydeck>=0.9,<1",
  "joblib>=1.4,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
